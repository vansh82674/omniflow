version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: omniflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omniflow
    ports:
      - "5432:5432"
    volumes:
      - omniflow-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omniflow-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  omniflow-db-data:
